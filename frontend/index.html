<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroRadar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --soil:#6b4f2a; --crop:#2f6b3a; --crop-soft:#e6efe7; --bg:#f6f3ec; --border:#d9d2c3; --text:#2a2620; --muted:#666; --alert:#a33; --warn:#b58a1b; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; background:var(--crop); color:#fff; display:flex; gap:12px; align-items:flex-start; justify-content:space-between; }
  header h1 { margin:0; font-size:22px; } header p { margin:2px 0 0; opacity:.85; font-size:13px; }
  .lang { display:flex; border:1px solid #fff8; border-radius:6px; overflow:hidden; flex:none; }
  .lang button { background:transparent; padding:4px 10px; border-radius:0; font-size:13px; }
  .lang button[aria-pressed=true] { background:#fff; color:var(--crop); font-weight:600; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .progress { list-style:none; display:flex; gap:4px; padding:0; margin:0 0 16px; }
  .progress li { flex:1; text-align:center; font-size:12px; color:var(--muted); }
  .progress li::before { content:''; display:block; height:6px; border-radius:3px; background:var(--border); margin-bottom:4px; }
  .progress li.done::before, .progress li.current::before { background:var(--crop); }
  .progress li.current { color:var(--text); font-weight:600; }
  .step h2 { margin:0 0 4px; font-size:22px; }
  .why { background:var(--crop-soft); border-left:4px solid var(--crop); padding:8px 12px; border-radius:6px; margin:8px 0 16px; font-size:14px; }
  .why b { display:block; }
  .guide { margin:0 0 12px; padding-left:22px; } .guide li { margin:4px 0; }
  .map-wrap { position:relative; }
  #map { height:360px; border:1px solid var(--border); border-radius:8px; transition:box-shadow .3s; }
  #map.flash { box-shadow:0 0 0 4px var(--warn); }
  .hint { position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:500; background:#fff; border:2px solid var(--crop);
          border-radius:999px; padding:6px 14px; font-weight:600; pointer-events:none; white-space:nowrap; box-shadow:0 2px 6px #0003; }
  .hint[hidden] { display:none; }
  button { font:inherit; padding:10px 18px; background:var(--crop); color:#fff; border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  button.secondary { background:#fff; color:var(--crop); border:1px solid var(--crop); }
  button.small { padding:4px 10px; font-size:14px; }
  .plot-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  .field { margin:14px 0; } .field > label, .field > .label { display:block; font-weight:600; margin-bottom:4px; }
  .field small { display:block; color:var(--muted); }
  select, input[type=date], input[type=number] { font:inherit; padding:6px; max-width:100%; border:1px solid var(--border); border-radius:6px; background:#fff; }
  .options { display:grid; gap:8px; }
  .option { display:flex; gap:10px; align-items:flex-start; background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px; cursor:pointer; }
  .option:has(input:checked) { border-color:var(--crop); background:var(--crop-soft); }
  .option input { margin-top:4px; } .option span small { display:block; color:var(--muted); }
  .nav { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; margin:20px 0 8px; }
  .nav .right { display:flex; gap:8px; margin-left:auto; }
  #step_msg { margin:8px 0; min-height:1.5em; }
  .card { background:#fff; border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px; }
  .card h3 { margin:0 0 8px; font-size:17px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .tab { background:#fff; color:var(--text); border:1px solid var(--border); padding:6px 12px; border-radius:999px; font-size:14px; }
  .tab[aria-pressed=true] { background:var(--crop); color:#fff; border-color:var(--crop); }
  #view_info img { max-width:100%; height:auto; display:block; margin:6px 0; }
  .rot { display:grid; grid-template-columns:150px 1fr 90px; align-items:center; gap:8px; margin:4px 0; }
  @media (max-width:480px) { .rot { grid-template-columns:110px 1fr 70px; } .hint { font-size:13px; } }
  .bar { position:relative; height:14px; background:#eee; border-radius:7px; }
  .range { position:absolute; height:100%; background:#bcd8c0; border-radius:7px; }
  .dot { position:absolute; top:-3px; width:4px; height:20px; background:var(--crop); }
  .ev { display:inline-block; width:20px; text-align:center; border-radius:4px; color:#fff; font-weight:bold; font-size:12px; }
  .evA { background:#2f6b3a; } .evB { background:#b58a1b; } .evC { background:#888; }
  .alert { color:var(--alert); } small { color:var(--muted); }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:14px; } td, th { padding:3px 6px; border-bottom:1px solid #eee; text-align:left; }
  #explanation { white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <div><h1>AgroRadar</h1><p data-t="subtitle"></p></div>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
  </div>
</header>
<main>
  <ol class="progress" id="progress"></ol>

  <!-- Step 1: where -->
  <section class="step" data-step="1">
    <h2 data-t="s1_title"></h2>
    <div class="why"><b data-t="why_label"></b><span data-t="s1_why"></span></div>
    <ol class="guide">
      <li data-t="s1_g1"></li><li data-t="s1_g2"></li><li data-t="s1_g3"></li>
    </ol>
    <div id="map_slot_plot">
      <div class="map-wrap" id="map_wrap"><div id="map"></div><div class="hint" id="map_hint" data-t="map_hint"></div></div>
    </div>
    <p><button type="button" id="locate" class="secondary small" data-t="use_location"></button> <span id="map_status"></span></p>
    <div id="plots"></div>
  </section>

  <!-- Step 2: what and when -->
  <section class="step" data-step="2" hidden>
    <h2 data-t="s2_title"></h2>
    <div class="why"><b data-t="why_label"></b><span data-t="s2_why"></span></div>
    <div class="field"><label for="planned_crop" data-t="planned_crop"></label>
      <select id="planned_crop"><option value="maize" data-t="maize"></option><option value="bean" data-t="bean"></option><option value="green_manure" data-t="green_manure"></option></select></div>
    <div class="field"><label for="planting_date" data-t="planting_date"></label>
      <input type="date" id="planting_date"><small id="season_auto"></small>
      <details><summary><small data-t="other_season"></small></summary>
        <select id="season"><option value="" data-t="infer_from_date"></option><option value="primera" data-t="primera"></option><option value="postrera" data-t="postrera"></option></select>
      </details></div>
    <div class="field"><label for="current_crop" data-t="current_crop"></label>
      <select id="current_crop"><option value="maize" data-t="maize"></option><option value="bean" data-t="bean"></option><option value="none" data-t="none"></option></select>
      <small data-t="current_crop_help"></small></div>
  </section>

  <!-- Step 3: land -->
  <section class="step" data-step="3" hidden>
    <h2 data-t="s3_title"></h2>
    <div class="why"><b data-t="why_label"></b><span data-t="s3_why"></span></div>
    <div class="field"><span class="label" data-t="soil_cover_q"></span>
      <div class="options">
        <label class="option"><input type="radio" name="cover" value="stubble"><span><b data-t="stubble"></b><small data-t="stubble_help"></small></span></label>
        <label class="option"><input type="radio" name="cover" value="bare_soil"><span><b data-t="bare_soil"></b><small data-t="bare_soil_help"></small></span></label>
        <label class="option"><input type="radio" name="cover" value="green_manure"><span><b data-t="green_manure"></b><small data-t="green_manure_help"></small></span></label>
        <label class="option"><input type="radio" name="cover" value="" checked><span><b data-t="dont_know"></b><small data-t="dont_know_help"></small></span></label>
      </div></div>
    <div class="field"><label for="slope_pct" data-t="slope_q"></label>
      <input type="number" id="slope_pct" min="0" max="100" style="width:100px"> %
      <small data-t="slope_help"></small></div>
  </section>

  <!-- Step 4: worries -->
  <section class="step" data-step="4" hidden>
    <h2 data-t="s4_title"></h2>
    <div class="why"><b data-t="why_label"></b><span data-t="s4_why"></span></div>
    <div class="options">
      <label class="option"><input type="checkbox" name="prio" value="water" checked><span><b data-t="water"></b><small data-t="water_help"></small></span></label>
      <label class="option"><input type="checkbox" name="prio" value="erosion"><span><b data-t="erosion"></b><small data-t="erosion_help"></small></span></label>
      <label class="option"><input type="checkbox" name="prio" value="nitrogen"><span><b data-t="nitrogen"></b><small data-t="nitrogen_help"></small></span></label>
    </div>
    <details class="field"><summary><small data-t="advanced"></small></summary>
      <label for="enso_phase" data-t="enso_filter"></label>
      <select id="enso_phase"><option value="" data-t="no_filter"></option><option value="el_nino" data-t="el_nino"></option><option value="la_nina" data-t="la_nina"></option><option value="neutral" data-t="neutral"></option></select>
      <small data-t="enso_help"></small>
    </details>
  </section>

  <!-- Step 5: results -->
  <section class="step" data-step="5" hidden>
    <h2 data-t="s5_title"></h2>
    <div id="result"></div>
  </section>

  <div id="step_msg" role="status"></div>
  <div class="nav">
    <button type="button" id="back" class="secondary" data-t="back"></button>
    <button type="button" id="edit" class="secondary" data-t="edit"></button>
    <div class="right">
      <button type="button" id="restart" class="secondary" data-t="restart"></button>
      <button type="button" id="next"></button>
    </div>
  </div>
</main>

            en: 'How much water there is where the roots are. Each square is about 9 km wide, so it shows your area, not just your plot.'},
    read: {es: 'En la barra de colores, a la izquierda está el suelo seco y a la derecha el húmedo.', en: 'On the colour bar, dry soil is on the left and wet soil on the right.'}},
  greenness: {layer: 'MODIS_Terra_L3_NDVI_16Day', level: 9, ext: 'png', legend: 'MODIS_L3_NDVI_H.svg', source: 'MODIS Terra NDVI (NASA)',
    name: {es: 'Verdor', en: 'Greenness'},
    shows: {es: 'Qué tan verde está la vegetación en los últimos 16 días.', en: 'How green the vegetation is over the last 16 days.'},
    read: {es: 'Café = poca vegetación o suelo desnudo; verde oscuro = vegetación fuerte.', en: 'Brown = little vegetation or bare soil; dark green = strong vegetation.'}},
  rain: {layer: 'IMERG_Precipitation_Rate', level: 6, ext: 'png', legend: 'GPM_Precipitation_Rate_H.svg', source: 'GPM IMERG (NASA)',
    name: {es: 'Lluvia', en: 'Rain'},
    shows: {es: 'La lluvia del día según el satélite. Sin color = no llovió.', en: "The day's rain as seen by the satellite. No colour = no rain."},
    read: {es: 'En la barra de colores, a la izquierda poca lluvia y a la derecha mucha.', en: 'On the colour bar, light rain is on the left and heavy rain on the right.'}},
  ground_heat: {layer: 'MODIS_Terra_Land_Surface_Temp_Day', level: 7, ext: 'png', legend: 'MODIS_Land_Surface_Temp_H.svg', source: 'MODIS Terra (NASA)',
    name: {es: 'Calor del suelo', en: 'Ground heat'},
    shows: {es: 'Qué tan caliente está el suelo de día. Las nubes dejan huecos sin color.', en: 'How hot the ground is during the day. Clouds leave gaps with no colour.'},
    read: {es: 'En la barra de colores, a la izquierda frío y a la derecha muy caliente.', en: 'On the colour bar, cool is on the left and very hot on the right.'}},
  satellite_photo: {layer: 'MODIS_Terra_CorrectedReflectance_TrueColor', level: 9, ext: 'jpeg', legend: null, source: 'MODIS Terra (NASA)',
    name: {es: 'Foto del satélite', en: 'Satellite photo'},
    shows: {es: 'Una foto reciente de su zona desde el espacio.', en: 'A recent photo of your area from space.'},
    read: {es: 'Verde = vegetación; café = suelo desnudo; blanco = nubes.', en: 'Green = vegetation; brown = bare soil; white = clouds.'}},
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
let lang = 'es';
try { const saved = localStorage.getItem('lang'); if (saved in T) lang = saved; } catch (e) {}
const tr = k => T[lang][k] ?? T.es[k] ?? k;
const n = k => esc(tr(k));
const LAST_QUESTION = 4;
let step = 1, last = null, viewIdx = 0, satLayer = null;

// --- map ---
const map = L.map('map').setView([13.7, -88.5], 8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap'}).addTo(map);
function placeMap(slotId) {
  const slot = $(slotId);
  if (slot && $('map_wrap').parentElement !== slot) slot.appendChild($('map_wrap'));
  setTimeout(() => map.invalidateSize(), 0);
}
function setSatellite(v) {
  if (satLayer) { map.removeLayer(satLayer); satLayer = null; }
  if (!v) return;
  satLayer = L.tileLayer(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${v.layer}/default/default/GoogleMapsCompatible_Level${v.level}/{z}/{y}/{x}.${v.ext}`,
    {maxNativeZoom: v.level, maxZoom: 18, opacity: 0.7, attribution: 'NASA EOSDIS GIBS'}).addTo(map);
}

// --- plots ---
const plots = [];
let nextId = 1;
function addPlot(latlng) {
  if (plots.length >= 10) return;
  const id = 'p' + nextId++;
  const marker = L.marker(latlng).addTo(map).bindTooltip(id, {permanent: true});
  plots.push({id, lat: +latlng.lat.toFixed(5), lon: +latlng.lng.toFixed(5), area: 1, marker});
  $('map_status').textContent = '';
  $('step_msg').textContent = '';
  drawPlots();
}
function removePlot(i) { map.removeLayer(plots[i].marker); plots.splice(i, 1); drawPlots(); }
map.on('click', e => { if (step === 1) addPlot(e.latlng); });
$('locate').onclick = () => {
  const fail = () => { $('map_status').innerHTML = `<small class="alert">${n('no_location')}</small>`; };
  if (!navigator.geolocation) return fail();
  $('map_status').innerHTML = `<small>${n('locating')}</small>`;
  navigator.geolocation.getCurrentPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    map.setView(ll, 14);
    addPlot(ll);
  }, fail, {timeout: 10000});
};
function drawPlots() {
  $('map_hint').hidden = plots.length > 0 || step !== 1;
  $('plots').innerHTML = plots.map((p, i) =>
    `<div class="plot-row"><b>${p.id}</b> — ${n('area')} <input type="number" step="0.1" min="0" value="${p.area}" style="width:80px"
      onchange="plots[${i}].area=+this.value"> mz <button type="button" class="secondary small" onclick="removePlot(${i})">${n('remove')}</button></div>`).join('');
}

// --- planting date and season ---
const today = new Date();
$('planting_date').value = `${today.getFullYear() + (today.getMonth() > 6 ? 1 : 0)}-05-25`;
function seasonAuto() {
  const m = +($('planting_date').value.split('-')[1] || 0);
  $('season_auto').textContent = m ? tr('season_auto').replace('{s}', tr(m <= 7 ? 'primera' : 'postrera')) : '';
}
$('planting_date').oninput = seasonAuto;

// --- steps ---
function show(s) {
  step = s;
  document.querySelectorAll('.step').forEach(el => { el.hidden = +el.dataset.step !== s; });
  $('progress').innerHTML = T[lang].steps.map((label, i) =>
    `<li class="${i + 1 < s ? 'done' : i + 1 === s ? 'current' : ''}">${esc(label)}</li>`).join('');
  $('back').hidden = s === 1 || s === 5;
  $('edit').hidden = $('restart').hidden = s !== 5;
  $('next').hidden = s === 5;
  $('next').textContent = tr(s === LAST_QUESTION ? 'compute' : 'next');
  if (s === 1) { setSatellite(null); placeMap('map_slot_plot'); }
  drawPlots();
}
function flashMap() {
  $('map').classList.add('flash');
  $('map').scrollIntoView({behavior: 'smooth', block: 'center'});
  setTimeout(() => $('map').classList.remove('flash'), 2000);
}
$('next').onclick = () => {
  $('step_msg').textContent = '';
  if (step === 1 && !plots.length) { $('step_msg').innerHTML = `<span class="alert">${n('need_plot')}</span>`; return flashMap(); }
  if (step === 2 && !$('planting_date').value) { $('step_msg').innerHTML = `<span class="alert">${n('need_date')}</span>`; return; }
  if (step === LAST_QUESTION) return compute();
  show(step + 1);
  window.scrollTo({top: 0, behavior: 'smooth'});
};
$('back').onclick = () => { $('step_msg').textContent = ''; show(step - 1); };
$('edit').onclick = () => show(1);
$('restart').onclick = () => {
  while (plots.length) removePlot(0);
  last = null; $('result').innerHTML = ''; map.setView([13.7, -88.5], 8);
  show(1);
};

async function compute() {
  const prios = [...document.querySelectorAll('[name=prio]:checked')].map(x => x.value);
  const cover = document.querySelector('[name=cover]:checked').value;
  const farm = {farm_id: 'f' + Date.now(), lang, enso_phase: $('enso_phase').value || null, plots: plots.map(p => {
    const x = {plot_id: p.id, geometry: {type: 'Point', coordinates: [p.lon, p.lat]}, area_mz: p.area,
      current_crop: $('current_crop').value, planned_crop: $('planned_crop').value,
      planting_date: $('planting_date').value, priorities: prios};
    if ($('season').value) x.season = $('season').value;
    if (cover) x.current_cover = cover;
    if ($('slope_pct').value) x.slope_pct = +$('slope_pct').value;
    return x; })};
  $('next').disabled = $('back').disabled = true;
  $('step_msg').textContent = tr('computing');
  try {
    const r = await fetch('/api/farm', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(farm)});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail?.warning || r.statusText);
    last = d; viewIdx = 0; $('step_msg').textContent = '';
    show(5); render(d);
    window.scrollTo({top: 0, behavior: 'smooth'});
  } catch (e) { $('step_msg').innerHTML = `<span class="alert">${esc(e.message)}</span>`; }
  $('next').disabled = $('back').disabled = false;
}

// --- results ---
const ev = e => `<span class="ev ev${esc(e)}" title="${n('evidence')} ${esc(e)}">${esc(e)}</span>`;
function fmtDate(md) { const [m, d] = md.split('-'); return T[lang].date_fmt(m, d); }

function showView(i) {
  viewIdx = i;
  const sv = last.satellite_views[i], v = VIEWS[sv.view];
  document.querySelectorAll('#view_tabs .tab').forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  setSatellite(v);
  $('view_info').innerHTML = `<p>${esc(v.shows[lang])}</p>
    <p><b>${n('sat_why')}:</b> ${sv.reasons.map(n).join(' ')}</p>
    <p><b>${n('sat_read')}:</b> ${esc(v.read[lang])}</p>
    ${v.legend ? `<img src="https://gibs.earthdata.nasa.gov/legends/${v.legend}" alt="${esc(v.name[lang])}">` : ''}
    <small>${n('source')}: ${esc(v.source)}, ${n('latest')}.</small>`;
}

function render(d) {
  placeMap('map_slot_plot');  // park the map before the results are redrawn
  let h = d.lang !== lang ? `<p><small>${n('relang')}</small></p>` : '';
  h += d.warnings.map(a => `<p class="alert">${esc(a)}</p>`).join('');
  if (d.explanation) h += `<div class="card"><h3>${n('explanation')}</h3><div id="explanation"></div>${d.agent_warnings.map(a => `<p class="alert"><small>${esc(a)}</small></p>`).join('')}</div>`;
  else h += d.agent_warnings.map(a => `<p><small>${esc(a)}</small></p>`).join('');
  if (d.ranking.length > 1) h += `<div class="card"><h3>${n('ranking')}</h3><ol>${d.ranking.map(r => `<li>${esc(r.plot_id)} — ${n('weigh_most')}: ${r.why.map(n).join(' ' + n('and') + ' ')}</li>`).join('')}</ol></div>`;
  for (const p of d.plots) {
    h += `<div class="card"><h3>${n('plot')} ${esc(p.plot_id)}</h3><small>${n(p.season)} · ${p.n_years_index} ${n('years')}${p.enso_phase_filter ? ' (' + n('only_years') + ' ' + n(p.enso_phase_filter) + ')' : ''} · ${n('confidence')}: ${n(p.confidence_level)}</small>`;
    h += `<p><small>${n('success')} = ${esc(p.success_definition)}.</small></p>`;
    for (const r of p.rotations) {
      h += `<div class="rot"><span>${n(r.id)}</span>`;
      h += r.index == null ? `<span><small>${n('no_index')}</small></span>`
        : `<div class="bar"><div class="range" style="left:${r.range_80[0]}%;width:${r.range_80[1] - r.range_80[0]}%"></div><div class="dot" style="left:${r.index}%"></div></div>`;
      h += `<span>${r.index == null ? '' : `<b>${r.index}</b> <small>${r.range_80[0]}–${r.range_80[1]}</small>`}</span></div>`;
    }
    h += `<div class="table-wrap"><table><tr><th>${n('risk')}</th><th>${n('prob')}</th><th>${n('range80')}</th><th>${n('years_col')}</th></tr>${p.risks.map(r =>
      `<tr><td>${ev(r.evidence)} ${n(r.event)}</td><td>${Math.round(r.p * 100)}%</td><td>${Math.round(r.ci80[0] * 100)}–${Math.round(r.ci80[1] * 100)}%</td><td>${r.k} ${n('of')} ${r.n}</td></tr>`).join('')}</table></div>`;
    h += `<p>${p.contributions.map(c => `${ev(c.evidence)} ${n(c.variable)}${c.index_contribution != null ? ' ' + c.index_contribution : ''}`).join(' · ')}</p>`;
    const t = p.erosion_trend, tp = p.terrain_profile;
    if (t) h += `<p>${esc(tr('erosion_in').replace('{n}', t.years))}: <b>${n(t.direction)}</b> <small>(${t.band_80[0]}–${t.band_80[1]} ${n('times_now')}; ${n(t.note)})</small></p>`;
    h += `<p><small>${n('climate')} ${esc(tp.climate.years)}: ${tp.climate.mean_annual_rain_mm} ${n('mm_year')}, ${n('rains_start')}${esc(fmtDate(tp.climate.median_rain_onset))}. ${n('slope')} ${tp.slope_pct}% (${n(tp.slope_source)}).</small></p>`;
    if (p.missing_data.length) h += `<p><small>${n('missing')}: ${p.missing_data.map(n).join(', ')}</small></p>`;
    h += `<details><summary><small>${n('assumptions')}</small></summary><small>${p.assumptions_used.map(esc).join(', ')}</small></details></div>`;
  }
  h += `<div class="card"><h3>${n('sat_title')}</h3><p><small>${n('sat_intro')}</small></p>
    <div class="tabs" id="view_tabs">${d.satellite_views.map((sv, i) => `<button type="button" class="tab" onclick="showView(${i})">${esc(VIEWS[sv.view].name[lang])}</button>`).join('')}</div>
    <div id="map_slot_result"></div><div id="view_info"></div></div>`;
  if (d.current_enso) h += `<p><small>${n('current_enso')}: ${n(d.current_enso.phase)} (ONI ${esc(d.current_enso.season)} ${d.current_enso.year} = ${d.current_enso.oni}, NOAA)</small></p>`;
  $('result').innerHTML = h;
  if (d.explanation) $('explanation').textContent = d.explanation;
  placeMap('map_slot_result');
  const b = L.latLngBounds(plots.map(p => [p.lat, p.lon]));
  setTimeout(() => map.fitBounds(b.pad(0.5), {maxZoom: 10}), 50);
  showView(Math.min(viewIdx, d.satellite_views.length - 1));
}

// --- language ---
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  seasonAuto();
  show(step);
  if (step === 5 && last) render(last);
}
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang();
});

applyLang();
</script>
</body>
</html>
