<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroRadar</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Public+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* AgroRadar design system, palette B (accessible). Reference: design/design-system.webp */
  :root {
    --evergreen:#185C3B; --evergreen-hover:#134B30; --evergreen-pressed:#0E3A25; --leaf:#2F7A4F;
    --lime:#7ED957;      /* large UI only: fills, icons, bars; never text */
    --lime-soft:#EEF8E8; --sage:#E8F0E3; --sky:#0F7DB6; --sky-soft:#E7F2F9;
    --clay:#5A544B; --clay-soft:#F1EEE8; --mist:#EDEBE7; --canvas:#FAF9F4; --surface:#FFFFFF; --ink:#1F2A24;
    --error:#B3261E; --error-soft:#FCEBEA; --warning:#8A5A00; --warning-soft:#FFF4DE;
    --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:20px; --r-2xl:28px; --pill:999px;
    --grad:linear-gradient(135deg, var(--lime) 0%, var(--leaf) 60%, var(--evergreen) 100%);
    --band:linear-gradient(165deg, #C4EC9E 0%, var(--lime) 40%, var(--leaf) 100%);
    --e2:0 1px 2px rgba(24,92,59,.06), 0 2px 8px rgba(31,42,36,.05);
    --e4:0 2px 4px rgba(24,92,59,.08), 0 8px 24px rgba(31,42,36,.08);
    --e-card:0 1px 2px rgba(24,92,59,.06), 0 16px 36px -14px rgba(24,92,59,.28);
    --font:'Atkinson Hyperlegible', 'Public Sans', system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/24px var(--font); color:var(--ink);
         background:linear-gradient(180deg, var(--lime-soft) 0, var(--canvas) 520px) var(--canvas) no-repeat; }
  :focus-visible { outline:3px solid var(--sky); outline-offset:2px; }
  svg.i { display:block; flex:none; }
  .sr { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  [hidden] { display:none !important; }

  /* app bar */
  header { position:sticky; top:0; z-index:1000; background:rgba(255,255,255,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--mist); }
  .bar-in { max-width:860px; margin:0 auto; padding:8px 16px; display:flex; gap:16px; align-items:center; justify-content:space-between; }
  .brand img { display:block; height:51px; width:auto; }  /* 15% larger than 44px */
  .lang { display:flex; background:var(--mist); border-radius:var(--pill); padding:4px; flex:none; }
  .lang button { background:transparent; color:var(--clay); padding:4px 12px; min-height:32px; border-radius:var(--pill); font-size:14px; line-height:20px; border:0; }
  .lang button:hover { background:transparent; color:var(--evergreen); }
  .lang button[aria-pressed=true] { background:var(--surface); color:var(--evergreen); box-shadow:var(--e2); }

  main { max-width:860px; margin:0 auto; padding:24px 16px 0; }

  /* stepper */
  .progress { list-style:none; display:flex; padding:0; margin:0 0 24px; }
  .progress li { flex:1; min-width:0; position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;
                 font-size:12px; line-height:16px; color:var(--clay); text-align:center; }
  .progress li::before { content:''; position:absolute; top:19px; right:50%; width:100%; height:3px; background:var(--mist); }
  .progress li:first-child::before { display:none; }
  .progress li.done::before, .progress li.current::before { background:var(--lime); }
  .progress .dot { position:relative; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--mist); color:var(--clay); }
  .progress li.done .dot { background:var(--lime); color:var(--evergreen); }
  .progress li.current .dot { background:var(--evergreen); color:#fff; box-shadow:0 0 0 5px rgba(126,217,87,.45); }
  .progress li.current { color:var(--evergreen); font-weight:700; }
  @media (max-width:420px) { .progress li span:not(.dot) { display:none; } .progress li.current span { display:block; } }

  /* hero panels */
  .hero { position:relative; overflow:hidden; display:flex; gap:16px; align-items:center; background:var(--sage);
          border-radius:var(--r-2xl); padding:24px; margin-bottom:24px; }
  .hero::after { content:''; position:absolute; right:-48px; top:-56px; width:220px; height:200px; background:rgba(126,217,87,.22);
                 border-radius:62% 38% 46% 54% / 60% 44% 56% 40%; }
  .hero > * { position:relative; z-index:1; }
  .hero .txt { flex:1; min-width:0; }
  .kicker { margin:0 0 4px; font-size:12px; line-height:16px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--leaf); }
  .hero h2 { margin:0 0 8px; font-size:28px; line-height:34px; letter-spacing:-.01em; color:var(--evergreen); }
  .lede { margin:0; color:var(--clay); }
  .lede b { display:block; color:var(--ink); font-size:14px; line-height:20px; margin-bottom:2px; }
  .badge { width:72px; height:72px; border-radius:50%; background:var(--lime); color:var(--evergreen); display:grid; place-items:center; flex:none; }
  .illus { width:170px; flex:none; }
  @media (min-width:640px) { .hero { padding:32px; } .hero h2 { font-size:36px; line-height:44px; } .illus { width:220px; } }
  @media (max-width:560px) { .hero { flex-direction:column-reverse; align-items:flex-start; padding:20px; } .badge { width:56px; height:56px; } .illus { width:130px; align-self:flex-end; margin:-8px 0 -16px; } }

  /* intro (landing) */
  .intro { background:var(--surface); box-shadow:var(--e-card); padding:32px 24px; }
  .intro::after { background:rgba(126,217,87,.28); width:300px; height:280px; right:-80px; top:-90px; }
  .intro h2 { font-size:34px; line-height:40px; }
  .tagline { margin:0 0 16px; font-size:18px; line-height:28px; color:var(--evergreen); font-weight:700; }
  .intro p.what { margin:0 0 24px; color:var(--clay); font-size:16px; line-height:24px; max-width:52ch; }
  .cta { min-height:56px; padding:14px 28px; font-size:18px; box-shadow:0 10px 24px -10px rgba(24,92,59,.6); }
  .fine { display:block; margin-top:12px; font-size:12px; line-height:16px; color:var(--clay); }
  @media (min-width:640px) { .intro { padding:40px; } .intro h2 { font-size:44px; line-height:52px; } }

  /* feature cards: gradient band + overlapping icon orb (reference card) */
  .fgrid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); margin:0 0 24px; }
  .fcard { position:relative; display:grid; grid-template-columns:64px 1fr; background:var(--surface); border-radius:24px; box-shadow:var(--e-card); min-height:120px; }
  .fcard .band { border-radius:24px 0 0 24px; background:var(--band); }
  .fcard .orb { position:absolute; top:16px; left:36px; width:56px; height:56px; border-radius:50%; background:var(--grad); color:#fff;
                border:4px solid #fff; display:grid; place-items:center; box-shadow:0 6px 14px -4px rgba(24,92,59,.45); font-weight:700; font-size:20px; }
  .fcard .body { padding:16px 16px 16px 44px; min-width:0; }
  .fcard .body b.t { display:block; font-size:16px; line-height:24px; color:var(--ink); padding-right:8px; }
  .fcard .body p { margin:4px 0 0; font-size:14px; line-height:20px; color:var(--clay); }
  .fcard .tag { position:absolute; top:-10px; right:12px; }
  .fcard.rec { outline:3px solid var(--lime); }

  /* messages */
  .msg { display:flex; gap:12px; align-items:flex-start; border-radius:var(--r-lg); padding:12px 16px; margin:8px 0 16px; }
  .msg::before { flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px; color:#fff; }
  .msg.info { background:var(--sky-soft); } .msg.info::before { content:'i'; background:var(--sky); }
  .msg.warning { background:var(--warning-soft); color:#3D2A00; } .msg.warning::before { content:'!'; background:var(--warning); }
  .msg.error { background:var(--error-soft); color:#5C1410; } .msg.error::before { content:'!'; background:var(--error); }
  .alert { color:var(--error); }

  /* map (kept as it was; only the frame follows the system) */
  .map-wrap { position:relative; }
  #map { height:360px; border:1px solid var(--mist); border-radius:var(--r-xl); transition:box-shadow .3s; }
  #map.flash { box-shadow:0 0 0 4px var(--lime); }
  .hint { position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:500; background:var(--surface); border:2px solid var(--evergreen); color:var(--evergreen);
          border-radius:var(--pill); padding:4px 16px; font-weight:700; pointer-events:none; white-space:nowrap; box-shadow:var(--e4); }

  /* buttons */
  button { font:inherit; font-weight:700; display:inline-flex; gap:8px; align-items:center; justify-content:center; padding:12px 24px; min-height:48px;
           background:var(--evergreen); color:#fff; border:2px solid var(--evergreen); border-radius:var(--pill); cursor:pointer; }
  button:hover { background:var(--evergreen-hover); border-color:var(--evergreen-hover); }
  button:active { background:var(--evergreen-pressed); border-color:var(--evergreen-pressed); }
  button:disabled { background:var(--mist); border-color:var(--mist); color:#9A948A; cursor:wait; }
  button.secondary { background:var(--surface); color:var(--evergreen); }
  button.secondary:hover { background:var(--lime); border-color:var(--evergreen); }
  button.tertiary { background:transparent; border-color:transparent; color:var(--evergreen); padding-left:8px; padding-right:8px; }
  button.tertiary:hover { background:var(--lime-soft); }
  button.destructive { background:var(--surface); color:var(--error); border-color:var(--error); }
  button.destructive:hover { background:var(--error-soft); }
  button.small { padding:4px 12px; min-height:36px; font-size:14px; line-height:20px; }
  .locate-row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:0 0 16px; }
  .geo-note { display:flex; gap:12px; align-items:flex-start; background:var(--sky-soft); border-radius:var(--r-xl); padding:14px 16px; margin:0 0 12px; }
  .geo-note .gi { width:36px; height:36px; border-radius:50%; background:var(--surface); color:var(--sky); display:grid; place-items:center; flex:none; }
  .geo-note p { margin:0; font-size:14px; line-height:20px; color:var(--ink); }
  .geo-note b { display:block; font-size:15px; margin-bottom:2px; color:var(--sky); }
  .coords-box { background:var(--surface); border:1px solid var(--mist); border-radius:var(--r-xl); padding:14px 16px; margin:0 0 16px; box-shadow:var(--e2); }
  .coords-box label { display:block; font-weight:700; margin-bottom:8px; }
  .coords-row { display:flex; gap:8px; }
  .coords-row input { flex:1; min-width:0; font:inherit; min-height:48px; padding:8px 16px; border:1px solid #CFCAC1; border-radius:var(--r-lg); }
  .coords-row input:focus { outline:none; border-color:var(--evergreen); box-shadow:0 0 0 3px rgba(24,92,59,.18); }
  .coords-box small { display:block; margin-top:6px; }
  #coords_msg:empty { display:none; } #coords_msg .msg { margin:8px 0 0; }
  #map_status:empty { display:none; }
  #map_status .msg { margin:0; }
  @media (max-width:560px) { #locate { width:100%; } }

  #plots { display:grid; gap:8px; margin-top:16px; }
  .plot-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--mist); border-radius:var(--r-xl); padding:8px 8px 8px 12px; box-shadow:var(--e2); }
  .plot-row label { display:flex; gap:8px; align-items:center; }
  .chip { display:inline-flex; gap:4px; align-items:center; background:var(--lime-soft); color:var(--evergreen); border-radius:var(--pill); padding:2px 12px; font-weight:700; font-size:14px; line-height:24px; }
  .chip.clay { background:var(--clay-soft); color:var(--clay); }
  .plot-row button { margin-left:auto; }

  /* inputs */
  .field { margin:24px 0; } .field > label, .field > .label { display:block; font-weight:700; font-size:18px; line-height:28px; margin-bottom:12px; }
  .field small { display:block; color:var(--clay); margin-top:8px; }
  select, input[type=date], input[type=number] { font:inherit; min-height:48px; padding:8px 16px; max-width:100%; border:1px solid #CFCAC1; border-radius:var(--r-lg); background:var(--surface); color:var(--ink); }
  select:hover, input:hover { border-color:var(--clay); }
  select:focus, input:focus { outline:none; border-color:var(--evergreen); box-shadow:0 0 0 3px rgba(24,92,59,.18); }
  details summary { cursor:pointer; color:var(--evergreen); margin-top:8px; }
  details summary small, .field summary small { color:var(--evergreen); font-weight:700; display:inline; margin:0; }
  details select { margin-top:8px; }
  .range-row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .range-row label { display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--clay); }
  .season-box { margin-top:12px; display:flex; gap:12px; align-items:center; background:var(--lime-soft); border-radius:var(--r-lg); padding:12px 16px; color:var(--evergreen); font-weight:700; }

  /* icon tiles */
  .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
  .tiles.five { grid-template-columns:repeat(2, 1fr); }
  @media (min-width:640px) { .tiles.five { grid-template-columns:repeat(5, 1fr); } }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; text-align:center; font-weight:700;
          background:var(--surface); border:2px solid var(--mist); border-radius:var(--r-xl); cursor:pointer; }
  .tile small { font-weight:400; color:var(--clay); font-size:13px; line-height:18px; }
  .tile .ic { width:56px; height:56px; border-radius:18px; background:var(--sage); color:var(--evergreen); display:grid; place-items:center; }
  .tile:hover { border-color:#CFCAC1; }
  .tile:has(input:checked) { border-color:var(--evergreen); background:var(--lime-soft); }
  .tile:has(input:checked) .ic { background:var(--evergreen); color:#fff; }
  .tile:has(input:focus-visible), .option:has(input:focus-visible) { outline:3px solid var(--sky); outline-offset:2px; }

  /* option cards */
  .options { display:grid; gap:12px; }
  .options.three { grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); }
  .option { position:relative; display:flex; gap:16px; align-items:center; background:var(--surface); border:2px solid var(--mist); border-radius:var(--r-xl); padding:12px 16px; cursor:pointer; }
  .option:hover { border-color:#CFCAC1; }
  .option .ic { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; flex:none; background:var(--sage); color:var(--evergreen); }
  .option .ic.sky { background:var(--sky-soft); color:var(--sky); } .option .ic.clay { background:var(--clay-soft); color:var(--clay); }
  .option > span:not(.ic):not(.tick) { flex:1; min-width:0; }
  .option span small { display:block; color:var(--clay); font-size:14px; line-height:20px; font-weight:400; }
  .tick { width:24px; height:24px; border-radius:50%; border:2px solid #CFCAC1; flex:none; display:grid; place-items:center; color:transparent; }
  .option.check .tick { border-radius:7px; }
  .option:has(input:checked) { border-color:var(--evergreen); background:var(--lime-soft); }
  .option:has(input:checked) .tick { background:var(--evergreen); border-color:var(--evergreen); color:#fff; }
  .options.three .option { flex-direction:column; align-items:flex-start; padding:16px; }
  .options.three .tick { position:absolute; top:16px; right:16px; }
  .trends { margin-top:24px; background:var(--surface); border-radius:var(--r-2xl); padding:16px 20px; box-shadow:var(--e-card); }
  .trends summary { display:flex; gap:12px; align-items:center; margin:0; font-weight:700; font-size:18px; color:var(--evergreen); list-style:none; }
  .trends summary::-webkit-details-marker { display:none; }
  .trends summary .ic { width:44px; height:44px; border-radius:50%; background:var(--grad); color:#fff; display:grid; place-items:center; flex:none; border:3px solid #fff; box-shadow:0 4px 12px -4px rgba(24,92,59,.5); }
  .trends summary small { display:block; color:var(--clay); font-weight:400; font-size:14px; }
  .trends .options { margin-top:16px; }

  /* navigation */
  .nav { position:sticky; bottom:0; z-index:900; display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center;
         margin:24px -16px 0; padding:12px 16px 16px; background:linear-gradient(to bottom, rgba(250,249,244,0), var(--canvas) 30%); }
  .nav { pointer-events:none; }  /* the see-through strip must not block taps on the map */
  .nav > * { pointer-events:auto; }
  .nav .right { display:flex; flex-wrap:wrap; gap:8px; margin-left:auto; }
  .nav.static { position:static; }
  @media (max-width:560px) { .nav .right { flex:1; } #next { flex:1; min-height:56px; } .nav.static .right button { flex:1; } }
  #step_msg:empty { display:none; }
  #step_msg { margin:16px 0 0; }
  .ask .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }

  /* cards */
  .card { background:var(--surface); border-radius:var(--r-2xl); padding:24px 20px; margin-bottom:20px; box-shadow:var(--e-card); }
  .card h3 { display:flex; gap:12px; align-items:center; margin:0 0 12px; font-size:22px; line-height:28px; color:var(--evergreen); }
  .card h3 .ic { width:44px; height:44px; border-radius:50%; background:var(--grad); color:#fff; display:grid; place-items:center; flex:none;
                 border:3px solid #fff; box-shadow:0 4px 12px -4px rgba(24,92,59,.5); }
  .card h4 { margin:32px 0 4px; font-size:18px; line-height:28px; color:var(--ink); }
  .card .sub { margin:0 0 12px; color:var(--clay); font-size:14px; line-height:20px; }
  .card p { margin:8px 0; }
  small { color:var(--clay); font-size:14px; line-height:20px; }
  .mini { background:var(--canvas); border:1px solid var(--mist); border-radius:var(--r-xl); padding:14px 16px; }
  .mini .k { display:block; font-size:12px; line-height:16px; color:var(--clay); text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .mini .v { display:block; font-size:18px; line-height:26px; font-weight:700; margin-top:2px; }

  /* summary: big gauge + fact cards */
  .summary { display:grid; grid-template-columns:240px 1fr; gap:24px; align-items:center; }
  @media (max-width:600px) { .summary { grid-template-columns:1fr; justify-items:center; } .facts { width:100%; } }
  .gauge { position:relative; width:240px; height:240px; }
  .gauge .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .gauge .num { font-size:60px; line-height:64px; font-weight:700; color:var(--evergreen); }
  .gauge .num small { font-size:20px; }
  .gauge .lbl { font-size:13px; line-height:18px; color:var(--clay); max-width:140px; margin-top:4px; }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .facts .mini.wide { grid-column:1 / -1; background:var(--lime-soft); border-color:transparent; }
  .facts .mini.wide .v { color:var(--evergreen); font-size:20px; }
  .good-def { margin:16px 0 0; display:flex; gap:8px; align-items:flex-start; color:var(--clay); font-size:14px; line-height:20px; }

  /* rotation feature cards */
  .rot-cards { margin:16px 0 0; }
  @media (min-width:640px) { .fgrid, .metrics.n3 { grid-template-columns:repeat(3, 1fr); } .metrics.n2, .metrics.n4 { grid-template-columns:repeat(2, 1fr); } }
  .score { display:flex; align-items:baseline; gap:4px; margin:4px 0 8px; } .score b { font-size:34px; line-height:40px; color:var(--evergreen); } .score small { font-size:14px; }
  .bar { position:relative; height:10px; background:var(--mist); border-radius:var(--pill); }
  .range { position:absolute; height:100%; background:rgba(126,217,87,.6); border-radius:var(--pill); }
  .dot { position:absolute; top:-4px; width:6px; height:18px; margin-left:-3px; border-radius:3px; background:var(--evergreen); }
  .delta { display:inline-block; margin-top:10px; font-weight:700; font-size:14px; line-height:20px; color:var(--evergreen); }
  .delta.same { color:var(--clay); }
  .best { background:var(--lime); color:var(--evergreen); border-radius:var(--pill); font-size:12px; line-height:22px; font-weight:700; padding:0 10px; }
  .legend-note { margin:12px 0 0; display:flex; gap:16px; flex-wrap:wrap; font-size:13px; line-height:18px; color:var(--clay); }
  .legend-note span { display:inline-flex; gap:6px; align-items:center; }
  .legend-note i { display:inline-block; width:18px; height:8px; border-radius:4px; background:rgba(126,217,87,.6); }
  .legend-note i.ln { width:4px; height:14px; background:var(--evergreen); }

  /* metrics */
  .metrics { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin:12px 0 0; }
  .m { border-radius:var(--r-xl); padding:16px; display:flex; flex-direction:column; gap:4px; }
  .m.sky { background:var(--sky-soft); } .m.lime { background:var(--lime-soft); } .m.clay { background:var(--clay-soft); }
  .m .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .m .mi { width:40px; height:40px; border-radius:50%; background:var(--surface); display:grid; place-items:center; }
  .m.sky .mi { color:var(--sky); } .m.lime .mi { color:var(--evergreen); } .m.clay .mi { color:var(--clay); }
  .m b { font-size:28px; line-height:34px; } .m b small { font-size:14px; font-weight:400; }
  .m span { font-size:15px; line-height:22px; }
  .pill { border:1.5px solid var(--ink); border-radius:var(--pill); padding:0 10px; font-size:12px; line-height:20px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .moist .m b { font-size:22px; line-height:28px; }
  .moist .scale { position:relative; height:10px; border-radius:var(--pill); margin:12px 0 4px; background:linear-gradient(90deg, #B59F86, var(--surface) 50%, #7DB8DA); }
  .moist .scale i { position:absolute; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:var(--sky); border:3px solid var(--surface); box-shadow:0 0 0 1.5px var(--ink); }
  .moist .scale.dry i { background:var(--clay); }
  .moist .ends { display:flex; justify-content:space-between; font-size:12px; line-height:16px; }
  .land { display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:center; background:var(--clay-soft); border-radius:var(--r-xl); padding:20px; margin-top:12px; }
  .land .big { text-align:center; display:flex; flex-direction:column; align-items:center; } .land .big b { display:block; font-size:40px; line-height:44px; } .land .big .pill { display:inline-block; margin-top:8px; }
  .land p { margin:0 0 8px; } .land small { display:block; margin-top:4px; }
  .slope-pic { color:var(--clay); }
  @media (max-width:480px) { .land { grid-template-columns:1fr; } }

  /* risks */
  .risks { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:12px; margin-top:12px; }
  .risk { background:var(--canvas); border:1px solid var(--mist); border-radius:var(--r-xl); padding:16px; }
  .risk .row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:10px; }
  .risk .nm { display:flex; gap:10px; align-items:center; font-weight:700; }
  .risk .nm .ri { width:36px; height:36px; border-radius:50%; background:var(--surface); color:var(--evergreen); display:grid; place-items:center; flex:none; box-shadow:var(--e2); }
  .risk .row > b { font-size:22px; line-height:28px; color:var(--evergreen); }
  .risk .bar { height:8px; } .risk .range { background:rgba(126,217,87,.45); } .risk .fill { position:absolute; height:100%; background:var(--evergreen); border-radius:var(--pill); }
  .risk small { display:block; margin-top:8px; }

  /* factors */
  .factor { display:grid; grid-template-columns:40px minmax(110px, 200px) 1fr auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--mist); }
  .factor .fi { width:40px; height:40px; border-radius:50%; background:var(--clay-soft); color:var(--clay); display:grid; place-items:center; }
  .factor .bar { height:14px; } .factor .fill { position:absolute; height:100%; border-radius:var(--pill); background:linear-gradient(90deg, #E9B949, #C2692F); }
  .factor .pts { font-weight:700; white-space:nowrap; }
  .factor .q { display:block; font-size:12px; line-height:16px; color:var(--clay); font-weight:400; }
  @media (max-width:520px) { .factor { grid-template-columns:40px 1fr auto; } .factor .bar { grid-column:2 / -1; grid-row:2; } }

  /* sources */
  .sources { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-top:12px; }
  .src { display:flex; gap:12px; align-items:flex-start; background:var(--canvas); border:1px solid var(--mist); border-radius:var(--r-xl); padding:14px; }
  .src .si { width:36px; height:36px; border-radius:50%; background:var(--surface); color:var(--evergreen); display:grid; place-items:center; flex:none; box-shadow:var(--e2); }
  .src b { display:block; } .src span { display:block; font-size:14px; line-height:20px; color:var(--clay); }
  .src .chip { display:inline-flex; margin-top:6px; font-size:12px; line-height:20px; padding:0 8px; color:var(--evergreen); }
  .src .chip.clay { color:var(--clay); }
  #explanation { white-space:pre-wrap; }

  /* forecast */
  .fc { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; }
  .fc .d { flex:1 0 76px; display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px 8px; border-radius:var(--pill);
           background:var(--canvas); border:1px solid var(--mist); text-align:center; font-size:14px; line-height:20px; }
  .fc .d b { font-size:16px; text-transform:capitalize; } .fc .d .wx { color:var(--sky); } .fc .d .t { font-weight:700; }
  .fc .d.today { background:var(--evergreen); border-color:var(--evergreen); color:#fff; box-shadow:var(--e4); }
  .fc .d.today .wx { color:var(--lime); } .fc .d.today small { color:#D8E8DD; }

  /* satellite */
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 16px; }
  .tab { background:var(--surface); color:var(--evergreen); border:2px solid var(--mist); padding:6px 16px; min-height:44px; font-size:16px; }
  .tab:hover { background:var(--lime-soft); border-color:var(--lime); }
  .tab[aria-pressed=true] { background:var(--evergreen); color:#fff; border-color:var(--evergreen); }
  #map_slot_result { margin-bottom:16px; }
  .vinfo { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  .vcard { background:var(--lime-soft); border-radius:var(--r-xl); padding:16px; }
  .vcard.sky { background:var(--sky-soft); } .vcard.clay { background:var(--clay-soft); }
  .vcard .vh { display:flex; gap:10px; align-items:center; font-weight:700; font-size:16px; margin-bottom:6px; color:var(--evergreen); }
  .vcard.sky .vh { color:var(--sky); } .vcard.clay .vh { color:var(--clay); }
  .vcard .vh span { width:32px; height:32px; border-radius:50%; background:var(--surface); display:grid; place-items:center; }
  .vcard p { margin:0; font-size:15px; line-height:22px; }
  .legend-card { grid-column:1 / -1; background:var(--surface); border:1px solid var(--mist); border-radius:var(--r-xl); padding:12px 16px; }
  .legend-card img { max-width:100%; height:auto; display:block; margin:4px auto; }
  ol li::marker { color:var(--evergreen); font-weight:700; }

  footer { max-width:860px; margin:24px auto 0; padding:24px 16px 32px; border-top:1px solid var(--mist); text-align:center; font-size:13px; line-height:20px; color:var(--clay); }
  footer b { color:var(--evergreen); }
  footer .code { display:inline-block; margin-top:4px; color:var(--evergreen); font-weight:700; text-underline-offset:3px; }
  /* share menu */
  dialog.sheet { border:none; border-radius:var(--r-2xl); padding:24px; width:min(420px, calc(100vw - 32px)); background:var(--surface); color:var(--ink); box-shadow:var(--e4); }
  dialog.sheet::backdrop { background:rgba(31,42,36,.45); }
  .sheet .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .sheet h3 { margin:0; font-size:20px; line-height:28px; }
  .sheet .opts { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; }
  .sheet h4 { grid-column:1 / -1; margin:8px 0 0; font-size:14px; line-height:20px; color:var(--clay); font-weight:700; }
  .sheet h4:first-child { margin-top:0; }
  .sheet .opt:disabled { opacity:.5; cursor:wait; background:transparent; }
  .sheet .opt.again { background:var(--lime-soft); box-shadow:inset 0 0 0 2px var(--evergreen); color:var(--evergreen); }
  @media (max-width:360px) { .sheet .opts { grid-template-columns:repeat(3, 1fr); } }
  .print-only { display:none; }
  @media print {
    @page { margin:12mm; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    body { background:#fff; }
    header { position:static; backdrop-filter:none; } header .lang, .nav, #progress, #step_msg, dialog, .toast, .tabs, .no-print { display:none !important; }
    .step:not([data-step="5"]) { display:none !important; }
    .print-only { display:block; margin:0 0 12px; font-size:13px; color:var(--clay); }
    /* the screen banner and map buttons only take room on paper */
    .step[data-step="5"] > .hero, .leaflet-control-zoom { display:none !important; }
    main { padding-top:0; }
    body { zoom:.82; }  /* screen sizes are generous; on paper this fits whole sections per page and leaves fewer gaps */
    /* big cards may split across pages (else a card taller than a page jumps whole to the next one and
       leaves the page before it empty); only the small blocks inside them stay together */
    .card { box-shadow:none; border:1px solid var(--mist); padding:16px; margin-bottom:12px; }
    .card h4 { margin-top:20px; }
    h3, h4, h3 + .sub, h4 + .sub { break-after:avoid; break-inside:avoid; }
    .summary, .fcard, .m, .risk, .land, .factor, .src, .fc, .vinfo > *, .legend-card, #map_slot_result, .print-only { break-inside:avoid; }
    footer { break-before:avoid; margin-top:8px; padding-top:12px; }
    .vinfo { grid-template-columns:repeat(3, 1fr); }  /* side by side, so the colour scale fits on the map's page */
    footer .code::after { content:' (github.com/8gmhjw9g5r-lgtm/agroradar)'; font-weight:400; }
  }
  .sheet .opt { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; min-height:auto; border-radius:var(--r-xl);
                background:transparent; border:none; color:var(--ink); font-size:14px; line-height:18px; font-weight:700; text-decoration:none; text-align:center; cursor:pointer; }
  .sheet .opt:hover { background:var(--lime-soft); }
  .sheet .opt .ic { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; color:#fff; }
  .sheet .opt[hidden] { display:none; }
  .toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:2000; background:var(--evergreen); color:#fff; padding:10px 20px; border-radius:var(--pill); box-shadow:var(--e4); font-weight:700; }
</style>
</head>
<body>
<header><div class="bar-in">
  <h1 class="brand" style="margin:0"><img src="/assets/logo.png" alt="AgroRadar" width="153" height="51"></h1>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
  </div>
</div></header>
<main>
  <!-- Step 0: intro -->
  <section class="step" data-step="0">
    <div class="hero intro">
      <div class="txt">
        <h2 data-t="intro_title"></h2>
        <p class="tagline" data-t="tagline"></p>
        <p class="what" data-t="intro_what"></p>
        <button type="button" class="cta" id="start"></button>
        <span class="fine" data-t="intro_fine"></span>
      </div>
      <svg class="illus" viewBox="0 0 160 160" aria-hidden="true">
        <path d="M24 126c-14-30 2-74 40-92 34-16 76-4 86 30 9 32-10 66-44 76-30 9-68 14-82-14z" fill="#DDEFD3"/>
        <ellipse cx="88" cy="146" rx="60" ry="7" fill="#C9E4BA"/>
        <path d="M128 30a14 14 0 0 1 14 14M128 20a24 24 0 0 1 24 24" stroke="#0F7DB6" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="128" cy="44" r="5" fill="#0F7DB6"/>
        <path d="M76 146V34" stroke="#185C3B" stroke-width="4" stroke-linecap="round"/>
        <path d="M76 124c-18-4-34-16-40-34 18 2 34 14 40 34z" fill="#185C3B"/>
        <path d="M76 100c16-6 30-20 34-38-16 4-30 18-34 38z" fill="#2F7A4F"/>
        <path d="M76 76c-14-6-24-18-26-34 14 4 24 16 26 34z" fill="#2F7A4F"/>
        <path d="M76 54c8-8 12-18 12-30-8 6-12 16-12 30z" fill="#185C3B"/>
        <ellipse cx="86" cy="88" rx="6" ry="13" fill="#7ED957" transform="rotate(22 86 88)"/>
        <path d="M80 100c2-9 7-16 13-20-1 9-5 16-13 20z" fill="#185C3B"/>
        <path d="M116 146V72" stroke="#2F7A4F" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M116 128c12-4 22-12 26-24-12 2-22 10-26 24z" fill="#185C3B"/>
        <path d="M116 106c-12-4-20-12-22-24 12 2 20 10 22 24z" fill="#2F7A4F"/>
        <path d="M116 88c8-4 14-10 16-20-8 2-14 8-16 20z" fill="#185C3B"/>
        <path d="M76 142c-9-5 9-11 0-17s9-11 0-17 9-11 0-17" stroke="#7ED957" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="67" cy="131" r="4.5" fill="#7ED957"/><circle cx="86" cy="118" r="4.5" fill="#7ED957"/><circle cx="67" cy="102" r="4" fill="#7ED957"/>
      </svg>
    </div>
    <div class="fgrid">
      <div class="fcard"><div class="band"></div><div class="orb" data-icon="pin" data-size="22"></div><div class="body"><b class="t" data-t="how1_t"></b><p data-t="how1"></p></div></div>
      <div class="fcard"><div class="band"></div><div class="orb" data-icon="sprout" data-size="22"></div><div class="body"><b class="t" data-t="how2_t"></b><p data-t="how2"></p></div></div>
      <div class="fcard"><div class="band"></div><div class="orb" data-icon="chart" data-size="22"></div><div class="body"><b class="t" data-t="how3_t"></b><p data-t="how3"></p></div></div>
    </div>
  </section>

  <ol class="progress" id="progress"></ol>

  <!-- Step 1: where -->
  <section class="step" data-step="1" hidden>
    <div class="hero">
      <div class="txt"><p class="kicker"></p><h2 data-t="s1_title"></h2><p class="lede"><b data-t="why_label"></b><span data-t="s1_why"></span></p></div>
      <div class="badge" data-icon="pin" data-size="36"></div>
    </div>
    <div class="fgrid">
      <div class="fcard"><div class="band"></div><div class="orb">1</div><div class="body"><p data-t="s1_g1"></p></div></div>
      <div class="fcard"><div class="band"></div><div class="orb">2</div><div class="body"><p data-t="s1_g2"></p></div></div>
      <div class="fcard"><div class="band"></div><div class="orb">3</div><div class="body"><p data-t="s1_g3"></p></div></div>
    </div>
    <div class="geo-note"><span class="gi" data-icon="locate" data-size="20"></span><p><b data-t="geo_note_t"></b><span data-t="geo_note"></span></p></div>
    <div class="locate-row"><button type="button" id="locate" class="secondary"></button><span id="map_status" role="status"></span></div>
    <div class="coords-box">
      <label for="coords" data-t="coords_label"></label>
      <div class="coords-row"><input id="coords" type="text" inputmode="text" autocomplete="off" placeholder="13.4800, -88.1800">
        <button type="button" id="coords_go" class="secondary"></button></div>
      <small data-t="coords_help"></small>
      <div id="coords_msg" role="status"></div>
    </div>
    <div id="map_slot_plot">
      <div class="map-wrap" id="map_wrap"><div id="map"></div><div class="hint" id="map_hint" data-t="map_hint"></div></div>
    </div>
    <div id="plots"></div>
  </section>

  <!-- Step 2: what and when -->
  <section class="step" data-step="2" hidden>
    <div class="hero">
      <div class="txt"><p class="kicker"></p><h2 data-t="s2_title"></h2><p class="lede"><b data-t="why_label"></b><span data-t="s2_why"></span></p></div>
      <div class="badge" data-icon="sprout" data-size="36"></div>
    </div>
    <div class="field"><span class="label" data-t="planned_crop"></span>
      <div class="tiles">
        <label class="tile"><input class="sr" type="radio" name="planned_crop" value="maize" checked><span class="ic" data-icon="maize" data-size="30"></span><span data-t="maize"></span></label>
        <label class="tile"><input class="sr" type="radio" name="planned_crop" value="bean"><span class="ic" data-icon="bean" data-size="30"></span><span data-t="bean"></span></label>
        <label class="tile"><input class="sr" type="radio" name="planned_crop" value="green_manure"><span class="ic" data-icon="clover" data-size="30"></span><span data-t="green_manure"></span></label>
      </div></div>
    <div class="field"><span class="label" data-t="planting_date"></span>
      <div class="range-row">
        <label><span data-t="from"></span><input type="date" id="date_from"></label>
        <label><span data-t="to"></span><input type="date" id="date_to"></label>
      </div>
      <small data-t="range_help"></small>
      <div class="season-box"><span data-icon="calendar"></span><span id="season_auto"></span></div>
      <details><summary><small data-t="other_season"></small></summary>
        <select id="season"><option value="" data-t="infer_from_date"></option><option value="primera" data-t="primera"></option><option value="postrera" data-t="postrera"></option></select>
      </details></div>
    <div class="field"><span class="label" data-t="current_crop"></span>
      <div class="tiles">
        <label class="tile"><input class="sr" type="radio" name="current_crop" value="maize" checked><span class="ic" data-icon="maize" data-size="30"></span><span data-t="maize"></span></label>
        <label class="tile"><input class="sr" type="radio" name="current_crop" value="bean"><span class="ic" data-icon="bean" data-size="30"></span><span data-t="bean"></span></label>
        <label class="tile"><input class="sr" type="radio" name="current_crop" value="none"><span class="ic" data-icon="bare" data-size="30"></span><span data-t="none"></span></label>
      </div>
      <small data-t="current_crop_help"></small></div>
  </section>

  <!-- Step 3: land -->
  <section class="step" data-step="3" hidden>
    <div class="hero">
      <div class="txt"><p class="kicker"></p><h2 data-t="s3_title"></h2><p class="lede"><b data-t="why_label"></b><span data-t="s3_why"></span></p></div>
      <div class="badge" data-icon="mountain" data-size="36"></div>
    </div>
    <div class="field"><span class="label" data-t="soil_cover_q"></span>
      <div class="options">
        <label class="option"><input class="sr" type="radio" name="cover" value="stubble"><span class="ic" data-icon="stubble"></span><span><b data-t="stubble"></b><small data-t="stubble_help"></small></span><span class="tick" data-icon="check" data-size="14"></span></label>
        <label class="option"><input class="sr" type="radio" name="cover" value="bare_soil"><span class="ic clay" data-icon="bare"></span><span><b data-t="bare_soil"></b><small data-t="bare_soil_help"></small></span><span class="tick" data-icon="check" data-size="14"></span></label>
        <label class="option"><input class="sr" type="radio" name="cover" value="green_manure"><span class="ic" data-icon="clover"></span><span><b data-t="green_manure"></b><small data-t="green_manure_help"></small></span><span class="tick" data-icon="check" data-size="14"></span></label>
        <label class="option"><input class="sr" type="radio" name="cover" value="" checked><span class="ic clay" data-icon="question"></span><span><b data-t="dont_know"></b><small data-t="dont_know_help"></small></span><span class="tick" data-icon="check" data-size="14"></span></label>
      </div></div>
    <div class="field"><span class="label" data-t="slope_q"></span>
      <div class="tiles five">
        <label class="tile"><input class="sr" type="radio" name="slope" value="3"><span class="ic" data-icon="slope0" data-size="30"></span><span data-t="flat"></span><small data-t="flat_help"></small></label>
        <label class="tile"><input class="sr" type="radio" name="slope" value="10"><span class="ic" data-icon="slope1" data-size="30"></span><span data-t="gentle"></span><small data-t="gentle_help"></small></label>
        <label class="tile"><input class="sr" type="radio" name="slope" value="22"><span class="ic" data-icon="slope2" data-size="30"></span><span data-t="steep"></span><small data-t="steep_help"></small></label>
        <label class="tile"><input class="sr" type="radio" name="slope" value="40"><span class="ic" data-icon="slope3" data-size="30"></span><span data-t="very_steep"></span><small data-t="very_steep_help"></small></label>
        <label class="tile"><input class="sr" type="radio" name="slope" value="" checked><span class="ic" data-icon="radar" data-size="30"></span><span data-t="dont_know"></span><small data-t="slope_sat_help"></small></label>
      </div></div>
  </section>

  <!-- Step 4: worries -->
  <section class="step" data-step="4" hidden>
    <div class="hero">
      <div class="txt"><p class="kicker"></p><h2 data-t="s4_title"></h2><p class="lede"><b data-t="why_label"></b><span data-t="s4_why"></span></p></div>
      <div class="badge" data-icon="target" data-size="36"></div>
    </div>
    <div class="options three">
      <label class="option check"><input class="sr" type="checkbox" name="prio" value="water" checked><span class="ic sky" data-icon="drop"></span><span><b data-t="water"></b><small data-t="water_help"></small></span><span class="tick" data-icon="check" data-size="14"></span></label>
      <label class="option check"><input class="sr" type="checkbox" name="prio" value="erosion"><span class="ic clay" data-icon="erosion"></span><span><b data-t="erosion"></b><small data-t="erosion_help"></small></span><span class="tick" data-icon="check" data-size="14"></span></label>
      <label class="option check"><input class="sr" type="checkbox" name="prio" value="nitrogen"><span class="ic" data-icon="leaf"></span><span><b data-t="nitrogen"></b><small data-t="nitrogen_help"></small></span><span class="tick" data-icon="check" data-size="14"></span></label>
    </div>
    <details class="trends"><summary><span class="ic" data-icon="trend" data-size="20"></span><span><span data-t="trends_title"></span><small data-t="trends_sub"></small></span></summary>
      <p class="sub" data-t="trends_impact" style="margin:12px 0 0;color:var(--clay)"></p>
      <div class="options">

function placeMap(slotId) {
  const slot = $(slotId);

  setTimeout(() => map.invalidateSize(), 0);
}
function setSatellite(v) {
  if (satLayer) { map.removeLayer(satLayer); satLayer = null; }
  if (!v) return;
  const day = new Date(); day.setDate(day.getDate() - (v.daysAgo || 0));  // local date: UTC can already be tomorrow
  const time = v.daysAgo ? `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}` : 'default';
  satLayer = L.tileLayer(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${v.layer}/default/${time}/GoogleMapsCompatible_Level${v.level}/{z}/{y}/{x}.${v.ext}`,
    {maxNativeZoom: v.level, maxZoom: 18, opacity: v.opacity ?? 0.7, attribution: 'NASA EOSDIS GIBS'}).addTo(map);
}

// --- plots (size in square metres; the API takes manzanas) ---
const plots = [];
let addingNew = false;  // true only after "Add another plot": otherwise a new tap moves the current plot
function setPos(p, latlng) { p.lat = +latlng.lat.toFixed(5); p.lon = +latlng.lng.toFixed(5); }
function addPlot(latlng) {
  if (plots.length >= 10) return;
  let k = 1; while (plots.some(p => p.id === 'p' + k)) k++;  // lowest free number: p1 again after "Start again"
  const id = 'p' + k;
  const marker = L.marker(latlng, {draggable: true}).addTo(map).bindTooltip(id, {permanent: true});
  const plot = {id, m2: 7000, marker};
  setPos(plot, latlng);
  marker.on('dragend', () => setPos(plot, marker.getLatLng()));
  plots.push(plot);
  drawPlots();
}
// Map tap, "use my location" and typed coordinates all go through here.
function placePlot(latlng) {
  $('map_status').textContent = ''; $('step_msg').textContent = ''; $('coords_msg').textContent = '';
  const cur = plots[plots.length - 1];
  if (cur && !addingNew) { setPos(cur, latlng); cur.marker.setLatLng(latlng); drawPlots(); return; }
  addingNew = false;
  addPlot(latlng);
}
function startAdd() { addingNew = true; drawPlots(); flashMap(); }
function removePlot(i) { map.removeLayer(plots[i].marker); plots.splice(i, 1); drawPlots(); }
map.on('click', e => { if (step === 1) placePlot(e.latlng); });

// Typed coordinates, e.g. pasted from Google Maps: "13.4800, -88.1800" (also accepts N/S/E/W/O letters).
$('coords_go').onclick = () => {
  const raw = $('coords').value.trim().toUpperCase().replace(/,(?=\d)/g, '.');  // "13,48" decimal commas
  const nums = raw.match(/-?\d+(\.\d+)?/g);
  const bad = () => { $('coords_msg').innerHTML = `<div class="msg error">${n('coords_bad')}</div>`; };
  if (!nums || nums.length < 2) return bad();
  let [lat, lon] = nums.slice(0, 2).map(Number);
  // typed as lon, lat (El Salvador: longitude about -87 to -91, latitude about 13 to 14.5)
  if ((Math.abs(lat) > 90 && Math.abs(lon) <= 90) || (Math.abs(lat) > 86 && Math.abs(lat) < 92 && lon > 12 && lon < 15.5)) [lat, lon] = [lon, lat];
  if (/S/.test(raw)) lat = -Math.abs(lat);
  if (/[WO]/.test(raw)) lon = -Math.abs(lon);
  // El Salvador is west of Greenwich: "13.48, 88.18" almost always means -88.18
  if (lon > 86 && lon < 92 && lat > 12 && lat < 15.5) lon = -lon;
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return bad();
  const ll = L.latLng(lat, lon);
  map.setView(ll, 15);
  placePlot(ll);
};
$('coords').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('coords_go').click(); } };
// Phones can take 10-20 s for a first GPS fix, and each failure needs its own advice.
$('locate').onclick = () => {
  const say = (cls, k) => { $('map_status').innerHTML = `<div class="msg ${cls}">${n(k)}</div>`; };
  const fail = e => {
    $('locate').disabled = false;
    say('error', !window.isSecureContext ? 'geo_insecure' : e && e.code === 1 ? 'geo_denied' : e && e.code === 3 ? 'geo_timeout' : 'no_location');
  };
  if (!navigator.geolocation) return fail();
  $('locate').disabled = true;
  say('info', 'locating');
  navigator.geolocation.getCurrentPosition(p => {
    $('locate').disabled = false;
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    map.setView(ll, 15);
    placePlot(ll);
    $('map_wrap').scrollIntoView({behavior: 'smooth', block: 'center'});
  }, fail, {enableHighAccuracy: true, timeout: 25000, maximumAge: 60000});
};
function drawPlots() {

  $('plots').innerHTML = plots.map((p, i) =>

    + (addingNew ? `<div class="msg info">${n('adding_new')}</div>`

}

$('share').onclick = async () => {

  // X allows 280 characters and Facebook only takes a link, so they get the first plot's headline
  const short = `AgroRadar · ${blocks[0].split('\n').slice(0, 2).join(' · ')}`;
  const url = location.origin, e = encodeURIComponent;
  // Phones only let a page share right after a tap, and the images take a moment to draw. So they are drawn as soon
  // as this menu opens; a tap that finds them ready shares at once, otherwise the button asks for one more tap.
  const ready = {};
  const prep = (key, make) => make().then(v => { ready[key] = v; }).catch(err => { ready[key] = err; });
  const cardP = prep('card', async () => [new File([await summaryCard(last)], 'agroradar.png', {type: 'image/png'})]);
  const canShareFiles = files => !!(navigator.canShare && navigator.canShare({files}));
  const shareFiles = (key, promise, save, extra = {}) => async el => {
    let files = ready[key];

      if (files instanceof Error) throw files;

      return save(files);

    if (files instanceof Error) throw files;
    if (canShareFiles(files)) {
      try { return await navigator.share({files, ...extra}); }
      catch (err) { if (err.name !== 'NotAllowedError') throw err; }  // the phone refused anyway: save instead
    }
    return save(files);
  };
  // Instagram and TikTok take no links or text from websites, only photos
  const social = app => shareFiles('card', cardP, files => { saveBlob(files[0], files[0].name); toast(fill('sh_saved_for', {app})); },
                                   {text: short + ' ' + url});
  const send = [
    {k: 'WhatsApp', ic: 'chat', bg: '#1E8A4C', href: `https://wa.me/?text=${e(text)}`},
    {k: 'Facebook', ic: 'share', bg: '#1A5FC8', href: `https://www.facebook.com/sharer/sharer.php?u=${e(url)}`},
    {k: 'Instagram', ic: 'camera', bg: '#B1306E', run: social('Instagram')},
    {k: 'TikTok', ic: 'note', bg: '#1F2A24', run: social('TikTok')},
    {k: 'LinkedIn', ic: 'briefcase', bg: '#0A66C2', href: `https://www.linkedin.com/sharing/share-offsite/?url=${e(url)}`},
    {k: 'X', ic: 'text', bg: '#1F2A24', href: `https://twitter.com/intent/tweet?text=${e(short)}&url=${e(url)}`},
    {k: 'Telegram', ic: 'send', bg: '#1C7DB8', href: `https://t.me/share/url?url=${e(url)}&text=${e(text)}`},
    {k: tr('sh_email'), ic: 'mail', bg: 'var(--clay)', href: `mailto:?subject=${e(tr('sh_subject'))}&body=${e(text)}`, self: true},
    {k: tr('sh_copy'), ic: 'copy', bg: 'var(--evergreen)', run: async () => { await navigator.clipboard.writeText(text); toast(tr('shared')); }},
  ];
  if (navigator.share) send.push({k: tr('sh_more'), ic: 'dots', bg: 'var(--leaf)', run: () => navigator.share({title: 'AgroRadar', text})});
  const save = [
    {k: tr('sh_pdf'), ic: 'file', bg: '#B3261E', run: printReport},
  ];

    ? `<a class="opt" href="${o.href}" ${o.self ? '' : 'target="_blank" rel="noopener"'} data-i="${i}"><span class="ic" style="background:${o.bg}">${icon(o.ic, 24)}</span>${esc(o.k)}</a>`
    : `<button type="button" class="opt" data-i="${i}"><span class="ic" style="background:${o.bg}">${icon(o.ic, 24)}</span>${esc(o.k)}</button>`;
  $('share_opts').innerHTML = `<h4>${n('sh_send')}</h4>${send.map(btn).join('')}<h4>${n('sh_save')}</h4>${save.map((o, i) => btn(o, send.length + i)).join('')}`;
  $('share_opts').onclick = async ev => {
    const el = ev.target.closest('.opt'); if (!el) return;

// A 1080x1350 (4:5) summary card for Instagram and TikTok, drawn directly so it needs no library.
async function summaryCard(d) {
  await document.fonts.ready;
  const p = d.plots[0], {best, differs} = bestOf(p), dec = p.terrain_profile.climate.last_decade || p.terrain_profile.climate;
  const top = p.risks.filter(r => !RELATIVE_RISKS.includes(r.event)).sort((a, b) => b.p - a.p)[0];
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), F = (w, s) => `${w} ${s}px "Atkinson Hyperlegible", sans-serif`;
  const wrap = (txt, x, y, max, lh) => { let line = ''; for (const w of txt.split(' ')) { const t2 = line ? line + ' ' + w : w;
    if (g.measureText(t2).width > max && line) { g.fillText(line, x, y); y += lh; line = w; } else line = t2; } g.fillText(line, x, y); return y + lh; };
  g.fillStyle = '#FAF9F4'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#185C3B'; g.fillRect(0, H - 150, W, 150);
  g.drawImage(await loadImg('/assets/logo.png'), 80, 80, 306, 102);

  g.fillStyle = '#185C3B'; g.font = F(700, 40); g.fillText(n(differs ? 'card_reco' : 'card_equal'), 80, 360);
  let y = 440;
  if (best && differs) { g.fillStyle = '#1F2A24'; g.font = F(700, 64); y = wrap(tr(best.id), 80, y, W - 160, 76); }
  if (best) {
    g.fillStyle = '#5A544B'; g.font = F(400, 34); g.fillText(n('card_score'), 80, y + 40);
    g.fillStyle = '#185C3B'; g.font = F(700, 200); g.fillText(String(best.index), 72, y + 230);
    const w = g.measureText(String(best.index)).width; g.font = F(400, 56); g.fillStyle = '#5A544B'; g.fillText('/100', 90 + w, y + 230);
    g.font = F(400, 34); g.fillText(fill('card_likely', {a: best.range_80[0], b: best.range_80[1]}), 80, y + 300); y += 380;
  }
  g.fillStyle = '#1F2A24'; g.font = F(400, 36);
  if (top) y = wrap(fill('sh_risk', {r: tr(top.event), p: Math.round(top.p * 100)}).replace(/^\S+\s/, '• '), 80, y, W - 160, 50);
  wrap(fill('sh_rain', {mm: dec.mean_annual_rain_mm.toLocaleString(loc()), d: dec.median_rain_onset ? fmtMD(dec.median_rain_onset) : '–'}).replace(/^\S+\s/, '• '), 80, y + 10, W - 160, 50);
  g.fillStyle = '#FFFFFF'; g.font = F(700, 44); g.fillText('agroradar.space', 80, H - 82);
  g.font = F(400, 30); g.fillText(n('card_data'), 80, H - 38);
  return new Promise(ok => c.toBlob(ok, 'image/png'));
}

const cardHead = (ic, title) => `<h3><span class="ic">${icon(ic, 20)}</span>${title}</h3>`;
const fmtMD = md => { const [m, d] = md.split('-'); return new Date(2001, m - 1, d).toLocaleDateString(loc(), T[lang].month_fmt); };
function bestOf(p) {
  const scored = p.rotations.filter(r => r.index != null);
  const best = scored.length ? scored.reduce((a, b) => (b.index > a.index ? b : a)) : null;
  return {best, differs: !!best && scored.some(r => r.index !== best.index)};
}

// Ring gauge: the arc is the index, the two dots mark the 80% range.
function gauge(r, id) {
  const S = 240, c = S / 2, R = 98, C = 2 * Math.PI * R, has = r && r.index != null;
  const pt = v => { const a = (v / 100) * 2 * Math.PI - Math.PI / 2; return [c + R * Math.cos(a), c + R * Math.sin(a)]; };
  let s = `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" aria-hidden="true"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7ED957"/><stop offset="1" stop-color="#185C3B"/></linearGradient></defs>
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#EDEBE7" stroke-width="20"/>`;
  if (has) {
    s += `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="url(#g${id})" stroke-width="20" stroke-linecap="round"
      stroke-dasharray="${C * r.index / 100} ${C}" transform="rotate(-90 ${c} ${c})"/>`;
    for (const v of r.range_80) { const [x, y] = pt(v); s += `<circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="#185C3B" stroke-width="3"/>`; }
  }
  s += '</svg>';
  const mid = has ? `<span class="num">${r.index}<small>/100</small></span><span class="lbl">${n('gauge_lbl')}<br>${n('range_word')} ${r.range_80[0]}–${r.range_80[1]}</span>`
    : `<span class="num">–</span><span class="lbl">${n('no_index')}</span>`;
  return `<div class="gauge">${s}<div class="mid">${mid}</div></div>`;
}

    <div class="m sky"><div class="top"><span class="mi">${icon('rain', 22)}</span></div><b>${dec.mean_annual_rain_mm.toLocaleString(loc())} <small>mm</small></b><span>${n('rain_label')}</span></div>
    ${dec.median_rain_onset ? `<div class="m lime"><div class="top"><span class="mi">${icon('calendar', 22)}</span></div><span>${n('onset_label')}</span><b>${esc(fmtMD(dec.median_rain_onset))}</b>
      ${dec.rain_onset_range ? `<small>${esc(fill('onset_range', {a: fmtMD(dec.rain_onset_range[0]), b: fmtMD(dec.rain_onset_range[1])}))}</small>` : ''}</div>` : ''}
    ${tp.climate.cycle_rain_mm ? `<div class="m sky"><div class="top"><span class="mi">${icon('drop', 22)}</span></div><span>${n('cycle_rain_label')}</span>
      <b>${tp.climate.cycle_rain_mm.normal_year.toLocaleString(loc())} <small>mm</small></b>
      <small>${esc(fill('cycle_rain_dry', {mm: tp.climate.cycle_rain_mm.dry_year.toLocaleString(loc())}))}</small></div>` : ''}
    ${g.mean_ndvi != null ? `<div class="m lime"><div class="top"><span class="mi">${icon('leaf', 22)}</span>${g.trend_10_years ? `<span class="pill">${n(g.trend_10_years)}</span>` : ''}</div><b>${g.mean_ndvi}</b><span>${n('ndvi_label')}</span><small>${n('ndvi_help')}</small></div>` : ''}
  </div>`;

  // soil moisture now (SMAP): shown only; it does not enter the index (see docs/SOIL_MOISTURE_ALERTS.md)
  // word cut-offs at 0.5 and 1.5 standard deviations are display labels, not model thresholds
  const moist = [['surface', tp.soil_moisture_anomaly_sd, 'drop'], ['root', tp.rootzone_moisture_anomaly_sd, 'sprout']].filter(m => m[1] != null);
  if (moist.length) {
    const word = sd => sd <= -1.5 ? 'much_drier' : sd <= -0.5 ? 'drier' : sd < 0.5 ? 'normal' : sd < 1.5 ? 'wetter' : 'much_wetter';
    const pos = sd => 50 + 50 * Math.max(-2.5, Math.min(2.5, sd)) / 2.5;
    h += `<h4>${n('moist_title')}</h4><p class="sub">${n('moist_sub')}</p><div class="metrics moist n${moist.length}">${moist.map(([k, sd, ic]) => `
      <div class="m ${sd <= -0.5 ? 'clay' : 'sky'}"><div class="top"><span class="mi">${icon(ic, 22)}</span></div><span>${n('moist_' + k)}</span>
        <b>${n('moist_' + word(sd))}</b>
        <div class="scale${sd <= -0.5 ? ' dry' : ''}" role="img" aria-label="${n('moist_' + word(sd))}"><i style="left:${pos(sd)}%"></i></div>
        <div class="ends"><span>${n('moist_dry_end')}</span><span>${n('moist_wet_end')}</span></div>
        <small>${n('moist_' + k + '_help')}</small></div>`).join('')}</div>
      <p class="sub">${n('moist_note')}</p>`;
  }

  // land, separate from rain, with its effect
  const cls = tp.slope_pct < 5 ? 'flat' : tp.slope_pct < 15 ? 'moderate' : 'steep';
  const pic = {flat: 'slope0', moderate: 'slope1', steep: 'slope3'}[cls];
  const src = tp.slope_source === 'nasa_appeears' ? 'slope_from_nasa' : tp.slope_source === 'user' ? 'slope_from_user' : 'slope_assumed';
  const t = p.erosion_trend;
  h += `<h4>${n('land_title')}</h4><div class="land"><div class="big"><span class="slope-pic">${icon(pic, 64)}</span><b>${tp.slope_pct}%</b><span class="pill">${n(cls + '_w')}</span></div>
    <div><p>${n('land_' + cls)}</p><small>${n(src)}</small>
    ${t ? `<small>${esc(fill('erosion_in', {n: t.years}))}: <b>${n(t.direction)}</b></small>` : ''}</div></div>`;

  // risks as cards
  // rain_deficit / rain_anomaly are measured against the place's own years, so they read ~25% / ~16%
  // everywhere; the season-rain card above shows the real difference between places instead
  const shown = p.risks.filter(r => !RELATIVE_RISKS.includes(r.event));
  h += `<h4>${n('risks_title')}</h4><p class="sub">${n('risks_sub')}</p><div class="risks">${shown.map(r => `<div class="risk">
      <div class="row"><span class="nm"><span class="ri">${icon(RISK_ICON[r.event] || 'info', 18)}</span>${n(r.event)}</span><b>${Math.round(r.p * 100)}%</b></div>
      <div class="bar"><div class="range" style="left:${r.ci80[0] * 100}%;width:${(r.ci80[1] - r.ci80[0]) * 100}%"></div><div class="fill" style="width:${r.p * 100}%"></div></div>
      <small>${esc(fill('in_years', {k: r.k, n: r.n}))} · ${n('range80')} ${Math.round(r.ci80[0] * 100)}–${Math.round(r.ci80[1] * 100)}%</small></div>`).join('')}</div>`;

  // what takes points off
  const hits = p.contributions.filter(c => c.index_contribution);
  const none = p.contributions.filter(c => !c.index_contribution);
  const max = Math.max(1, ...hits.map(c => Math.abs(c.index_contribution)));
  h += `<h4>${n('factors_title')}</h4><p class="sub">${n('factors_sub')}</p>${hits.map(c => `<div class="factor">
      <span class="fi">${icon(VAR_ICON[c.variable] || 'info', 20)}</span><span><b>${n(c.variable)}</b><span class="q">${n('q_' + c.evidence)}</span></span>
      <div class="bar"><div class="fill" style="width:${100 * Math.abs(c.index_contribution) / max}%"></div></div>
      <span class="pts">${c.index_contribution} ${n('pts')}</span></div>`).join('')}
    ${none.length ? `<p><small>${n('no_effect')}: ${none.map(c => n(c.variable)).join(', ')}.</small></p>` : ''}`;

  // where the data comes from (replaces the raw assumption codes)
  const S = [
    {i: 'rain', k: 'src_climate', v: `NASA POWER · ${esc(tp.climate.years)}`, real: true},
    {i: 'mountain', k: 'src_slope', v: tp.slope_source === 'nasa_appeears' ? 'NASA NASADEM' : tp.slope_source === 'user' ? n('src_you') : n('src_assumed_slope'), real: tp.slope_source !== 'assumed'},
    {i: 'leaf', k: 'src_green', v: g.mean_ndvi != null ? 'NASA MODIS' : n('src_pending'), real: g.mean_ndvi != null},
    {i: 'sprout', k: 'src_soil', v: tp.soil ? 'ISRIC SoilGrids' : n('src_soil_pending'), real: !!tp.soil},
    ...(d.forecast_7d?.daily?.length ? [{i: 'sun', k: 'src_fc', v: 'Open-Meteo', real: true}] : []),
    {i: 'radar', k: 'src_enso', v: d.current_enso ? `NOAA · ${esc(fill('enso_now', {p: tr(d.current_enso.phase + '_w'), v: d.current_enso.oni}))}` : 'NOAA', real: true},
    {i: 'chart', k: 'src_cal', v: n('src_mag'), real: true},
  ];
  h += `<h4>${n('sources_title')}</h4><p class="sub">${n('sources_sub')}</p><div class="sources">${S.map(s => `<div class="src"><span class="si">${icon(s.i, 18)}</span>
      <div><b>${n(s.k)}</b><span>${s.v}</span><span class="chip${s.real ? '' : ' clay'}">${n(s.real ? 'real' : 'assumed_chip')}</span></div></div>`).join('')}</div>`;
  return h + '</div>';
}

function render(d) {
  placeMap('map_slot_plot');  // park the map before the results are redrawn
  let h = `<p class="print-only">${esc(fill('print_head', {d: new Date().toLocaleDateString(loc(), {day: 'numeric', month: 'long', year: 'numeric'})}))}</p>`;
  h += d.lang !== lang ? `<div class="msg info">${n('relang')}</div>` : '';
  h += d.warnings.map(a => `<div class="msg warning">${esc(a)}</div>`).join('');
  if (d.explanation) h += `<div class="card">${cardHead('text', n('explanation'))}<div id="explanation"></div>${d.agent_warnings.map(a => `<p class="alert"><small>${esc(a)}</small></p>`).join('')}</div>`;
  if (d.ranking.length > 1) h += `<div class="card">${cardHead('target', n('ranking'))}<ol>${d.ranking.map(r => `<li>${esc(r.plot_id)} — ${n('weigh_most')}: ${r.why.map(n).join(' ' + n('and') + ' ')}</li>`).join('')}</ol></div>`;
  d.plots.forEach((p, pi) => { h += plotCard(p, pi, d); });
  const fc = d.forecast_7d;
  if (fc && fc.daily.length) {
    h += `<div class="card">${cardHead('sun', n('forecast_title'))}<div class="fc">${fc.daily.map((x, i) => {
      const dt = new Date(x.date + 'T12:00'), wet = (x.rain_mm ?? 0) >= 1;
      return `<div class="d${i === 0 ? ' today' : ''}"><b>${i === 0 ? n('today') : esc(dt.toLocaleDateString(loc(), {weekday: 'short'}))}</b><small>${dt.getDate()}</small>
        <span class="wx">${icon(wet ? 'rain' : 'sun', 28)}</span><span>${x.rain_mm ?? '–'} mm</span><span class="t">${x.t_max_c == null ? '–' : Math.round(x.t_max_c)}°C</span></div>`;
    }).join('')}</div></div>`;
  }
  h += `<div class="card">${cardHead('radar', n('sat_title'))}<p class="sub">${n('sat_intro')}</p>
    <div class="tabs" id="view_tabs">${d.satellite_views.map((sv, i) => `<button type="button" class="tab" onclick="showView(${i})">${icon(VIEWS[sv.view].icon, 18)}${esc(VIEWS[sv.view].name[lang])}</button>`).join('')}</div>
    <div id="map_slot_result"></div><div id="view_info"></div></div>`;
  $('result').innerHTML = h;
  if (d.explanation) $('explanation').textContent = d.explanation;
  placeMap('map_slot_result');
  const b = L.latLngBounds(plots.map(p => [p.lat, p.lon]));
  setTimeout(() => map.fitBounds(b.pad(0.5), {maxZoom: 10}), 50);
  showView(Math.min(viewIdx, d.satellite_views.length - 1));
}

// --- language ---
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => {
    if (el.dataset.t === 'footer') el.innerHTML = tr('footer'); else el.textContent = tr(el.dataset.t);
  });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  seasonAuto();
  show(step);
  if (step === 5 && last) render(last);
}
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang();
});

applyLang();
</script>
</body>
</html>
